########################################################################
# Sistema Secretaría Académica FII-UNP
# docker-compose.azure.yml
#
# Para Azure VM (Ubuntu + Nginx + Certbot en el host).
# El Nginx del HOST hace proxy → localhost:8080 (este frontend).
# No usa Traefik ni red de EasyPanel.
#
# USO:
#   cp .env.azure .env
#   docker compose -f docker-compose.azure.yml up -d --build
########################################################################

services:

  # ── Frontend / Gateway ────────────────────────────────────────────
  frontend:
    build:
      context: .
      dockerfile: docker/gateway/Dockerfile
    ports:
      - "8080:80"        # Nginx del host proxea aquí
    networks:
      - app-network
    depends_on:
      - nginx-api
    restart: unless-stopped

  # ── Nginx interno (proxy → PHP-FPM) ───────────────────────────────
  nginx-api:
    image: nginx:1.27-alpine
    volumes:
      - ./docker/nginx/backend.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
    networks:
      - app-network
    restart: unless-stopped

  # ── Backend Laravel / PHP-FPM ─────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
    volumes:
      - backend-storage:/var/www/html/storage
    environment:
      APP_NAME:     ${APP_NAME:-Secretaria FII-UNP}
      APP_ENV:      ${APP_ENV:-production}
      APP_DEBUG:    ${APP_DEBUG:-false}
      APP_KEY:      ${APP_KEY}
      APP_URL:      ${APP_URL}
      DB_CONNECTION: mysql
      DB_HOST:      db
      DB_PORT:      3306
      DB_DATABASE:  ${DB_DATABASE:-gestion_academica}
      DB_USERNAME:  ${DB_USERNAME:-secretaria}
      DB_PASSWORD:  ${DB_PASSWORD}
      REDIS_CLIENT: phpredis
      REDIS_HOST:   redis
      REDIS_PORT:   6379
      CACHE_STORE:        ${CACHE_STORE:-redis}
      SESSION_DRIVER:     ${SESSION_DRIVER:-redis}
      SESSION_LIFETIME:   ${SESSION_LIFETIME:-120}
      QUEUE_CONNECTION:   ${QUEUE_CONNECTION:-database}
      SANCTUM_STATEFUL_DOMAINS: ${SANCTUM_STATEFUL_DOMAINS}
      MAIL_MAILER:        ${MAIL_MAILER:-smtp}
      MAIL_HOST:          ${MAIL_HOST}
      MAIL_PORT:          ${MAIL_PORT:-587}
      MAIL_USERNAME:      ${MAIL_USERNAME}
      MAIL_PASSWORD:      ${MAIL_PASSWORD}
      MAIL_FROM_ADDRESS:  ${MAIL_FROM_ADDRESS:-noreply@unp.edu.pe}
      MAIL_FROM_NAME:     ${MAIL_FROM_NAME:-Secretaria FII-UNP}
      LLM_PROVIDER:       ${LLM_PROVIDER:-groq}
      GROQ_API_KEY:       ${GROQ_API_KEY}
      GROQ_MODEL:         ${GROQ_MODEL:-llama-3.3-70b-versatile}
      WHATSAPP_WEBHOOK_SECRET: ${WHATSAPP_WEBHOOK_SECRET}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - app-network
    restart: unless-stopped

  # ── Queue Worker ──────────────────────────────────────────────────
  queue:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
    command: php artisan queue:work --sleep=3 --tries=3 --max-time=3600
    volumes:
      - backend-storage:/var/www/html/storage
    environment:
      APP_NAME:     ${APP_NAME:-Secretaria FII-UNP}
      APP_ENV:      ${APP_ENV:-production}
      APP_DEBUG:    ${APP_DEBUG:-false}
      APP_KEY:      ${APP_KEY}
      APP_URL:      ${APP_URL}
      DB_CONNECTION: mysql
      DB_HOST:      db
      DB_PORT:      3306
      DB_DATABASE:  ${DB_DATABASE:-gestion_academica}
      DB_USERNAME:  ${DB_USERNAME:-secretaria}
      DB_PASSWORD:  ${DB_PASSWORD}
      REDIS_CLIENT: phpredis
      REDIS_HOST:   redis
      REDIS_PORT:   6379
      CACHE_STORE:        ${CACHE_STORE:-redis}
      SESSION_DRIVER:     ${SESSION_DRIVER:-redis}
      SESSION_LIFETIME:   ${SESSION_LIFETIME:-120}
      QUEUE_CONNECTION:   ${QUEUE_CONNECTION:-database}
      MAIL_MAILER:        ${MAIL_MAILER:-smtp}
      MAIL_HOST:          ${MAIL_HOST}
      MAIL_PORT:          ${MAIL_PORT:-587}
      MAIL_USERNAME:      ${MAIL_USERNAME}
      MAIL_PASSWORD:      ${MAIL_PASSWORD}
      MAIL_FROM_ADDRESS:  ${MAIL_FROM_ADDRESS:-noreply@unp.edu.pe}
      MAIL_FROM_NAME:     ${MAIL_FROM_NAME:-Secretaria FII-UNP}
      LLM_PROVIDER:       ${LLM_PROVIDER:-groq}
      GROQ_API_KEY:       ${GROQ_API_KEY}
      GROQ_MODEL:         ${GROQ_MODEL:-llama-3.3-70b-versatile}
      WHATSAPP_WEBHOOK_SECRET: ${WHATSAPP_WEBHOOK_SECRET}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - app-network
    restart: unless-stopped

  # ── MySQL 8.0 ─────────────────────────────────────────────────────
  db:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE:      ${DB_DATABASE:-gestion_academica}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_USER:          ${DB_USERNAME:-secretaria}
      MYSQL_PASSWORD:      ${DB_PASSWORD}
    volumes:
      - db-data:/var/lib/mysql
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "--silent"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ── Redis 7 ───────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    networks:
      - app-network
    restart: unless-stopped

networks:
  app-network:
    driver: bridge

volumes:
  db-data:
  redis-data:
  backend-storage:
