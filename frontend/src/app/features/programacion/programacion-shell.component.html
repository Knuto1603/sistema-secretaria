<div class="min-h-screen bg-slate-50">

  <!-- ── Cabecera del módulo ─────────────────────────────────── -->
  <div class="bg-white border-b border-slate-200 shadow-sm">
    <div class="max-w-screen-2xl mx-auto px-6">

      <!-- Título + selector de período -->
      <div class="flex flex-wrap items-center justify-between gap-4 pt-5 pb-4">
        <div>
          <h1 class="text-2xl font-black text-slate-800 tracking-tight leading-tight">
            Programación Académica
          </h1>
          <p class="text-xs text-slate-400 font-medium mt-0.5">
            Ciclo completo: borrador → publicación → gestión de cambios
          </p>
        </div>

        <!-- Selector de período -->
        <div class="flex items-center gap-3">
          <span class="text-[11px] font-bold text-slate-400 uppercase tracking-widest hidden sm:block">
            Período
          </span>
          @if (estado.loading()) {
            <div class="h-10 w-52 bg-slate-100 rounded-md animate-pulse"></div>
          } @else {
            <div class="relative">
              <select
                [ngModel]="estado.periodoId()"
                (ngModelChange)="onChangePeriodo($event)"
                class="pl-4 pr-10 py-2.5 text-sm font-semibold border border-slate-200 rounded-md bg-white
                       focus:ring-2 focus:ring-indigo-500 outline-none appearance-none cursor-pointer
                       shadow-sm hover:border-indigo-300 transition-colors">
                <option value="" disabled>Seleccionar período…</option>
                @for (p of estado.periodos(); track p.id) {
                  <option [value]="p.id">
                    {{ p.nombre }}{{ p.activo ? ' (Activo)' : '' }}
                  </option>
                }
              </select>
              <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center pr-3">
                <svg class="w-4 h-4 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/>
                </svg>
              </div>
            </div>
          }
        </div>
      </div>

      <!-- ── Stepper de ciclo de vida ─────────────────────── -->
      <div class="flex items-start gap-0 pb-5 overflow-x-auto">

        <!-- Paso 1: Borrador -->
        <div class="flex flex-col items-center flex-shrink-0">
          <div class="w-9 h-9 rounded-full flex items-center justify-center text-sm font-black
                      border-2 transition-all duration-200 shadow-sm"
               [class]="pasoActivo() === 1
                 ? 'bg-slate-500 border-violet-500 text-white shadow-violet-200'
                 : pasoActivo() > 1
                   ? 'bg-slate-100 border-violet-300 text-slate-600'
                   : 'bg-white border-slate-200 text-slate-400'">
            @if (pasoActivo() > 1) {
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M5 13l4 4L19 7"/>
              </svg>
            } @else { 1 }
          </div>
          <span class="text-[10px] font-bold mt-1.5 whitespace-nowrap transition-colors"
                [class]="pasoActivo() === 1 ? 'text-slate-700' : 'text-slate-400'">
            Borrador
          </span>
        </div>

        <!-- Línea conectora -->
        <div class="h-0.5 w-14 mt-4 mx-1 rounded-full transition-colors duration-300 flex-shrink-0"
             [class]="pasoActivo() >= 2 ? 'bg-emerald-400' : 'bg-slate-200'"></div>

        <!-- Paso 2: Publicar -->
        <div class="flex flex-col items-center flex-shrink-0">
          <div class="w-9 h-9 rounded-full flex items-center justify-center text-sm font-black
                      border-2 transition-all duration-200 shadow-sm"
               [class]="pasoActivo() === 2
                 ? 'bg-emerald-500 border-emerald-500 text-white shadow-emerald-200'
                 : pasoActivo() > 2
                   ? 'bg-emerald-100 border-emerald-300 text-emerald-600'
                   : 'bg-white border-slate-200 text-slate-400'">
            @if (pasoActivo() > 2) {
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M5 13l4 4L19 7"/>
              </svg>
            } @else { 2 }
          </div>
          <span class="text-[10px] font-bold mt-1.5 whitespace-nowrap transition-colors"
                [class]="pasoActivo() === 2 ? 'text-emerald-700' : 'text-slate-400'">
            Publicar
          </span>
        </div>

        <!-- Línea conectora -->
        <div class="h-0.5 w-14 mt-4 mx-1 rounded-full transition-colors duration-300 flex-shrink-0"
             [class]="pasoActivo() >= 3 ? 'bg-orange-400' : 'bg-slate-200'"></div>

        <!-- Paso 3: Modificar -->
        <div class="flex flex-col items-center flex-shrink-0">
          <div class="w-9 h-9 rounded-full flex items-center justify-center text-sm font-black
                      border-2 transition-all duration-200 shadow-sm"
               [class]="pasoActivo() === 3
                 ? 'bg-orange-500 border-orange-500 text-white shadow-orange-200'
                 : 'bg-white border-slate-200 text-slate-400'">
            3
          </div>
          <span class="text-[10px] font-bold mt-1.5 whitespace-nowrap transition-colors"
                [class]="pasoActivo() === 3 ? 'text-orange-700' : 'text-slate-400'">
            Modificar
          </span>
        </div>

      </div>

      <!-- ── Tabs de navegación ──────────────────────────────── -->
      <nav class="flex gap-1 -mb-px" role="navigation" aria-label="Secciones de programación">

        <a routerLink="borradores"
           routerLinkActive="border-violet-600 text-slate-700 bg-slate-50/60"
           class="flex items-center gap-2 px-4 py-3 text-sm font-semibold rounded-t-xl border-b-2
                  border-transparent text-slate-500 hover:text-slate-600 hover:border-violet-300
                  transition-all duration-150 whitespace-nowrap">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"/>
          </svg>
          Borradores
        </a>

        <a routerLink="modificaciones"
           routerLinkActive="border-orange-500 text-orange-700 bg-orange-50/60"
           class="flex items-center gap-2 px-4 py-3 text-sm font-semibold rounded-t-xl border-b-2
                  border-transparent text-slate-500 hover:text-orange-600 hover:border-orange-300
                  transition-all duration-150 whitespace-nowrap">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/>
          </svg>
          Modificaciones
        </a>

        <a routerLink="generar-documentos"
           routerLinkActive="border-teal-600 text-slate-700 bg-slate-50/60"
           class="flex items-center gap-2 px-4 py-3 text-sm font-semibold rounded-t-xl border-b-2
                  border-transparent text-slate-500 hover:text-slate-600 hover:border-teal-300
                  transition-all duration-150 whitespace-nowrap">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/>
          </svg>
          Generar Oficios
        </a>

      </nav>
    </div>
  </div>

  <!-- ── Contenido de la ruta activa ─────────────────────────── -->
  <div class="max-w-screen-2xl mx-auto px-6 py-6">
    <router-outlet />
  </div>

</div>
