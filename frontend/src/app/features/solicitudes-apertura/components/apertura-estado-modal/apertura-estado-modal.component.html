<div class="fixed inset-0 bg-black/40 backdrop-blur-sm z-50 flex items-center justify-center p-4">
  <div class="bg-white rounded-md shadow-xl w-full max-w-md p-7">

    <div class="flex items-start justify-between gap-4 mb-5">
      <div>
        <h3 class="text-base font-bold text-slate-800">{{ titulo() }}</h3>
        <p class="text-sm text-slate-500 mt-0.5">
          Se aplicará a {{ cantidad() }} {{ cantidad() === 1 ? 'solicitud' : 'solicitudes' }}.
        </p>
      </div>
      <button (click)="cerrado.emit()" [disabled]="enviando()"
        class="p-2 rounded-lg text-slate-400 hover:bg-slate-100 transition-colors flex-shrink-0 disabled:opacity-50">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
        </svg>
      </button>
    </div>

    <div class="space-y-4">
      <div>
        <label class="block text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-2">Nuevo estado</label>
        <div class="grid grid-cols-2 gap-2">
          @for (e of estados; track e.value) {
            <button type="button" (click)="estadoSeleccionado.set(e.value)"
              [class.border-indigo-500]="estadoSeleccionado() === e.value"
              [class.bg-indigo-50]="estadoSeleccionado() === e.value"
              [class.text-indigo-700]="estadoSeleccionado() === e.value"
              [class.border-slate-200]="estadoSeleccionado() !== e.value"
              [class.text-slate-600]="estadoSeleccionado() !== e.value"
              class="px-3 py-2.5 text-xs font-bold border rounded-md transition-colors hover:bg-slate-50">
              {{ e.label }}
            </button>
          }
        </div>
      </div>

      <div>
        <label class="block text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-2">
          Mensaje / observación (opcional)
        </label>
        <textarea [ngModel]="observaciones()" (ngModelChange)="observaciones.set($event)" rows="3"
          placeholder="Ej: Se abrió el curso con suficientes solicitantes."
          class="w-full px-3 py-2.5 text-sm border border-slate-200 rounded-md bg-slate-50 focus:ring-2 focus:ring-indigo-500 outline-none resize-none"></textarea>
      </div>

      @if (error()) {
        <div class="px-3 py-2 text-xs font-semibold text-red-600 bg-red-50 border border-red-200 rounded-md">
          {{ error() }}
        </div>
      }

      <div class="flex items-center justify-end gap-2 pt-2">
        <app-btn variant="secondary" [disabled]="enviando()" (clicked)="cerrado.emit()">Cancelar</app-btn>
        <app-btn variant="primary" [loading]="enviando()" [disabled]="!estadoSeleccionado() || enviando()" (clicked)="onConfirmar()">
          Aplicar
        </app-btn>
      </div>
    </div>
  </div>
</div>
