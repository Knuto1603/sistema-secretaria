; ============================================================
; PHP-FPM pool – producción
; ============================================================
[www]
user  = www-data
group = www-data

listen = 9000

pm                   = dynamic
pm.max_children      = 20
pm.start_servers     = 5
pm.min_spare_servers = 5
pm.max_spare_servers = 10

; Pasar las variables de entorno del contenedor a PHP.
; Sin esto, PHP-FPM limpia el entorno y env() devuelve null.
clear_env = no
