<div class="min-h-screen bg-slate-50">

  <!-- ── Cabecera ─────────────────────────────────────────────────── -->
  <div class="bg-white border-b border-slate-200 shadow-sm">
    <div class="max-w-screen-2xl mx-auto px-6 py-4">
      <div class="flex flex-wrap items-center justify-between gap-4">

        <!-- Título -->
        <div>
          <h1 class="text-2xl font-black text-slate-800 tracking-tight leading-tight">
            Programación Activa
          </h1>
          <p class="text-xs text-slate-400 font-medium mt-0.5">
            Oferta académica del período vigente
          </p>
        </div>

        <!-- Acciones de cabecera -->
        <div class="flex items-center gap-3 flex-wrap">

          <!-- Selector de período -->
          <div class="flex items-center gap-2">
            <span class="text-[11px] font-bold text-slate-400 uppercase tracking-widest hidden sm:block">
              Período
            </span>
            @if (estado.loading()) {
              <div class="h-10 w-52 bg-slate-100 rounded-md animate-pulse"></div>
            } @else {
              <div class="relative">
                <select
                  [ngModel]="estado.periodoId()"
                  (ngModelChange)="onChangePeriodo($event)"
                  class="pl-4 pr-10 py-2.5 text-sm font-semibold border border-slate-200 rounded-md bg-white
                         focus:ring-2 focus:ring-indigo-500 outline-none appearance-none cursor-pointer
                         shadow-sm hover:border-indigo-300 transition-colors">
                  <option value="" disabled>Seleccionar período…</option>
                  @for (p of estado.periodos(); track p.id) {
                    <option [value]="p.id">
                      {{ p.nombre }}{{ p.activo ? ' (Activo)' : '' }}
                    </option>
                  }
                </select>
                <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center pr-3">
                  <svg class="w-4 h-4 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/>
                  </svg>
                </div>
              </div>
            }
          </div>

          <!-- Badge: período inactivo -->
          @if (estado.periodo() && !estado.periodo()!.activo) {
            <span class="px-2.5 py-1 bg-amber-100 text-amber-700 text-[10px] font-bold uppercase rounded-lg tracking-wide">
              Período inactivo
            </span>
          }

          <!-- Link a gestión (solo admin) -->
          @if (esAdmin()) {
            <a routerLink="/app/programacion"
               class="flex items-center gap-1.5 px-3 py-2 text-xs font-bold text-indigo-600 hover:text-indigo-800
                      bg-indigo-50 hover:bg-indigo-100 border border-indigo-200 rounded-md transition-colors">
              <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/>
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
              </svg>
              Gestión
            </a>

            <!-- Botón: actualizar desde archivo (diff) -->
            <button
              type="button"
              (click)="showImportDiff.update(v => !v)"
              [class]="showImportDiff()
                ? 'flex items-center gap-1.5 px-3 py-2 text-xs font-bold text-amber-700 bg-amber-100 hover:bg-amber-200 border border-amber-300 rounded-md transition-colors'
                : 'flex items-center gap-1.5 px-3 py-2 text-xs font-bold text-slate-600 hover:text-slate-800 bg-slate-50 hover:bg-slate-100 border border-slate-200 rounded-md transition-colors'">
              <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"/>
              </svg>
              Actualizar desde archivo
            </button>
          }

        </div>
      </div>
    </div>
  </div>

  <!-- ── Contenido ─────────────────────────────────────────────────── -->
  <div class="max-w-screen-2xl mx-auto px-6 py-6">
    @if (showImportDiff() && esAdmin()) {
      <app-importar-diff />
    }
    <router-outlet />
  </div>

</div>
