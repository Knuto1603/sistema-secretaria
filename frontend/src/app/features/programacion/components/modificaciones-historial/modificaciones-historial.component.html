<!-- Encabezado -->
<div class="flex items-center justify-between mb-6">
  <div>
    <h1 class="text-xl font-bold text-slate-800">Modificaciones</h1>
    <p class="text-sm text-slate-500 mt-0.5">Selecciona una programación para ver sus cambios.</p>
  </div>
  <button (click)="irAGenerar()"
    class="flex items-center gap-2 px-4 py-2 bg-purple-600 hover:bg-purple-700 text-white text-sm font-semibold rounded-md transition-colors">
    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
        d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/>
    </svg>
    Generar documentos
  </button>
</div>

<!-- Selector de período -->
<div class="bg-white border border-slate-200 rounded-lg p-4 mb-6 shadow-sm flex items-center gap-3">
  <label class="text-[10px] font-bold uppercase tracking-widest text-slate-400 whitespace-nowrap">Período</label>
  <select
    [value]="estadoSvc.periodoId()"
    (change)="onPeriodoChange($any($event.target).value)"
    class="px-3 py-1.5 text-xs border border-slate-200 rounded-md focus:outline-none focus:ring-2 focus:ring-purple-300 bg-white min-w-[160px]">
    @for (p of estadoSvc.periodos(); track p.id) {
      <option [value]="p.id">{{ p.nombre }}</option>
    }
  </select>
</div>

<!-- Cargando -->
@if (cargando()) {
  <div class="flex items-center justify-center py-16">
    <svg class="w-8 h-8 text-purple-400 animate-spin" fill="none" viewBox="0 0 24 24">
      <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"/>
      <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8H4z"/>
    </svg>
  </div>
}

<!-- Sin datos -->
@if (!cargando() && borradores().length === 0) {
  <div class="flex flex-col items-center justify-center py-16 text-slate-400">
    <svg class="w-12 h-12 mb-3 text-slate-200" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
        d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"/>
    </svg>
    <p class="text-sm font-medium">No hay programaciones para este período</p>
  </div>
}

<!-- Lista de borradores -->
@if (!cargando() && borradores().length > 0) {
  <div class="grid gap-3">
    @for (b of borradores(); track b.id) {
      <button
        type="button"
        (click)="verDetalle(b)"
        class="w-full bg-white border border-slate-200 rounded-lg p-4 text-left hover:border-purple-300 hover:shadow-md transition-all group focus:outline-none focus-visible:ring-2 focus-visible:ring-purple-400">

        <div class="flex items-center justify-between">
          <div class="flex items-center gap-3">
            <!-- Ícono -->
            <div class="w-9 h-9 rounded-lg flex items-center justify-center shrink-0"
              [class.bg-emerald-100]="b.estado === 'publicado'"
              [class.bg-amber-100]="b.estado === 'borrador'">
              @if (b.estado === 'publicado') {
                <svg class="w-5 h-5 text-emerald-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/>
                </svg>
              } @else {
                <svg class="w-5 h-5 text-amber-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"/>
                </svg>
              }
            </div>

            <!-- Info principal -->
            <div>
              <div class="flex items-center gap-2">
                <span class="text-sm font-bold text-slate-800">{{ b.nombre }}</span>
                <span class="px-2 py-0.5 rounded-full text-[10px] font-bold"
                  [class.bg-emerald-100]="b.estado === 'publicado'"
                  [class.text-emerald-700]="b.estado === 'publicado'"
                  [class.bg-amber-100]="b.estado === 'borrador'"
                  [class.text-amber-700]="b.estado === 'borrador'">
                  {{ b.estado === 'publicado' ? 'Publicado' : 'Borrador' }}
                </span>
              </div>
              <p class="text-xs text-slate-500 mt-0.5">
                {{ b.total_secciones ?? 0 }} secciones
                &nbsp;·&nbsp;
                Creado por {{ b.creado_por }}
                &nbsp;·&nbsp;
                {{ b.created_at | date:'dd/MM/yyyy' }}
              </p>
            </div>
          </div>

          <!-- Flecha -->
          <svg class="w-5 h-5 text-slate-300 group-hover:text-purple-400 transition-colors shrink-0"
            fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/>
          </svg>
        </div>
      </button>
    }
  </div>
}
