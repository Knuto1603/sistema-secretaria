<div class="border-t border-slate-100 px-6 py-3 bg-slate-50/50">
  <div class="flex flex-wrap items-center gap-2">

    <!-- Selector de Periodo (solo admin) -->
    <div class="relative">
      <select
        [ngModel]="periodoSeleccionado()"
        (ngModelChange)="periodoChange.emit($event)"
        [disabled]="loadingPeriodos()"
        class="pl-3 pr-8 py-2 text-sm border border-slate-200 rounded-xl bg-white focus:ring-2 focus:ring-indigo-500 outline-none appearance-none cursor-pointer font-medium min-w-[155px] transition-all">
        @for (periodo of periodos(); track periodo.id) {
          <option [value]="periodo.id">{{ periodo.nombre }} {{ periodo.activo ? '(Activo)' : '' }}</option>
        }
      </select>
      <div class="absolute inset-y-0 right-0 flex items-center pr-2.5 pointer-events-none">
        <svg class="w-3.5 h-3.5 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path>
        </svg>
      </div>
    </div>

    <!-- Separador visual -->
    <div class="h-6 w-px bg-slate-200"></div>

    <!-- Escuela -->
    <div class="relative">
      <select
        [ngModel]="escuelaSeleccionada()"
        (ngModelChange)="escuelaChange.emit($event)"
        class="pl-3 pr-8 py-2 text-sm border rounded-xl bg-white focus:ring-2 focus:ring-indigo-500 outline-none appearance-none cursor-pointer font-medium min-w-[130px] transition-all"
        [ngClass]="escuelaSeleccionada() ? 'border-indigo-300 bg-indigo-50 text-indigo-700' : 'border-slate-200'">
        <option value="">Escuela</option>
        @for (e of escuelas(); track e.id) {
          <option [value]="e.id">{{ e.nombre_corto || e.nombre }}</option>
        }
      </select>
      <div class="absolute inset-y-0 right-0 flex items-center pr-2.5 pointer-events-none">
        <svg class="w-3.5 h-3.5 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path>
        </svg>
      </div>
    </div>

    <!-- Escuela programada -->
    <div class="relative">
      <select
        [ngModel]="escuelaProgramadaSeleccionada()"
        (ngModelChange)="escuelaProgramadaChange.emit($event)"
        class="pl-3 pr-8 py-2 text-sm border rounded-xl bg-white focus:ring-2 focus:ring-indigo-500 outline-none appearance-none cursor-pointer font-medium min-w-[145px] transition-all"
        [ngClass]="escuelaProgramadaSeleccionada() ? 'border-violet-300 bg-violet-50 text-violet-700' : 'border-slate-200'">
        <option value="">Prog. para...</option>
        @for (e of escuelas(); track e.id) {
          <option [value]="e.id">{{ e.nombre_corto || e.nombre }}</option>
        }
      </select>
      <div class="absolute inset-y-0 right-0 flex items-center pr-2.5 pointer-events-none">
        <svg class="w-3.5 h-3.5 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path>
        </svg>
      </div>
    </div>

    <!-- Ciclo -->
    <div class="relative">
      <select
        [ngModel]="cicloSeleccionado()"
        (ngModelChange)="cicloChange.emit($event)"
        class="pl-3 pr-8 py-2 text-sm border rounded-xl bg-white focus:ring-2 focus:ring-indigo-500 outline-none appearance-none cursor-pointer font-medium min-w-[100px] transition-all"
        [ngClass]="cicloSeleccionado() ? 'border-indigo-300 bg-indigo-50 text-indigo-700' : 'border-slate-200'">
        <option [value]="null">Ciclo</option>
        @for (c of ciclos; track c) {
          <option [value]="c">Ciclo {{ c }}</option>
        }
      </select>
      <div class="absolute inset-y-0 right-0 flex items-center pr-2.5 pointer-events-none">
        <svg class="w-3.5 h-3.5 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path>
        </svg>
      </div>
    </div>

    <!-- Departamento -->
    @if (departamentos().length > 0) {
      <div class="relative">
        <select
          [ngModel]="areaSeleccionada()"
          (ngModelChange)="areaChange.emit($event)"
          class="pl-3 pr-8 py-2 text-sm border rounded-xl bg-white focus:ring-2 focus:ring-indigo-500 outline-none appearance-none cursor-pointer font-medium min-w-[140px] transition-all"
          [ngClass]="areaSeleccionada() ? 'border-indigo-300 bg-indigo-50 text-indigo-700' : 'border-slate-200'">
          <option value="">Departamento</option>
          @for (dep of departamentos(); track dep.id) {
            <option [value]="dep.id">{{ dep.nombre }}</option>
          }
        </select>
        <div class="absolute inset-y-0 right-0 flex items-center pr-2.5 pointer-events-none">
          <svg class="w-3.5 h-3.5 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path>
          </svg>
        </div>
      </div>
    }

    <!-- Grupo -->
    @if (grupos().length > 0) {
      <div class="relative">
        <select
          [ngModel]="grupoSeleccionado()"
          (ngModelChange)="grupoChange.emit($event)"
          class="pl-3 pr-8 py-2 text-sm border rounded-xl bg-white focus:ring-2 focus:ring-indigo-500 outline-none appearance-none cursor-pointer font-medium min-w-[95px] transition-all"
          [ngClass]="grupoSeleccionado() ? 'border-indigo-300 bg-indigo-50 text-indigo-700' : 'border-slate-200'">
          <option value="">Grupo</option>
          @for (g of grupos(); track g) {
            <option [value]="g">{{ g }}</option>
          }
        </select>
        <div class="absolute inset-y-0 right-0 flex items-center pr-2.5 pointer-events-none">
          <svg class="w-3.5 h-3.5 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path>
          </svg>
        </div>
      </div>
    }

    <!-- Tipo (Obligatorio / Electivo) -->
    <div class="relative">
      <select
        [ngModel]="tipoSeleccionado()"
        (ngModelChange)="tipoChange.emit($event)"
        class="pl-3 pr-8 py-2 text-sm border rounded-xl bg-white focus:ring-2 focus:ring-indigo-500 outline-none appearance-none cursor-pointer font-medium min-w-[120px] transition-all"
        [ngClass]="tipoSeleccionado() === 'O' ? 'border-blue-300 bg-blue-50 text-blue-700' :
                   tipoSeleccionado() === 'E' ? 'border-amber-300 bg-amber-50 text-amber-700' :
                   'border-slate-200'">
        <option value="">Tipo</option>
        <option value="O">Obligatorio</option>
        <option value="E">Electivo</option>
      </select>
      <div class="absolute inset-y-0 right-0 flex items-center pr-2.5 pointer-events-none">
        <svg class="w-3.5 h-3.5 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path>
        </svg>
      </div>
    </div>

    <!-- Separador visual -->
    <div class="h-6 w-px bg-slate-200"></div>

    <!-- Buscador -->
    <div class="relative flex-1 min-w-[160px]">
      <svg class="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-slate-400 pointer-events-none" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0"></path>
      </svg>
      <input
        type="text"
        [ngModel]="searchTerm()"
        (ngModelChange)="searchChange.emit($event)"
        placeholder="Buscar curso o docente..."
        class="pl-9 pr-4 py-2 text-sm border border-slate-200 rounded-xl bg-white focus:ring-2 focus:ring-indigo-500 outline-none w-full transition-all">
    </div>

    <!-- Botón limpiar filtros -->
    @if (hayFiltrosActivos()) {
      <button (click)="limpiar.emit()"
        class="px-3 py-2 text-xs font-bold text-slate-500 hover:text-red-500 hover:bg-red-50 rounded-xl transition-colors border border-slate-200 flex items-center gap-1.5 whitespace-nowrap bg-white">
        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
        </svg>
        Limpiar
      </button>
    }

  </div>
</div>
