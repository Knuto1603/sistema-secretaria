# ============================================================
# Gateway – sirve Angular SPA y proxea /api al backend
# ============================================================
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 110M;

    # Compresión gzip
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 256;

    # ── API → nginx-api (interno) ──────────────────────────
    location /api {
        # DNS embebido de Docker: resuelve "nginx-api" en cada request en vez
        # de cachear la IP al arrancar el worker (evita "Connection refused"
        # tras un redeploy que recrea el contenedor con otra IP interna).
        resolver 127.0.0.11 valid=10s;
        set $upstream_nginx_api nginx-api:80;
        proxy_pass http://$upstream_nginx_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300;
        client_max_body_size 110M;
    }

    # ── Assets compilados de Angular ──────────────────────
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # ── index.html – nunca cachear (evita chunk mismatch post-deploy) ──
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    # ── SPA – siempre servir index.html ───────────────────
    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /favicon.ico {
        log_not_found off;
        access_log off;
    }
}
