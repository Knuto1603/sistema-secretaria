<div class="space-y-6">

  <!-- Header de página -->
  <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
    <div>
      <h1 class="text-2xl font-black text-slate-800 tracking-tight">Alumnos</h1>
      <p class="text-[10px] text-slate-400 font-bold uppercase tracking-widest mt-1">
        Gestión, historial académico e inscripciones
      </p>
    </div>

    <!-- Tabs -->
    <div class="flex bg-slate-100 rounded-md p-1 gap-0.5 self-start sm:self-auto">
      <button
        (click)="tabActiva.set('lista')"
        class="px-4 py-2 rounded-lg text-xs font-bold transition-all"
        [ngClass]="tabActiva() === 'lista' ? 'bg-white text-slate-800 shadow-sm' : 'text-slate-500 hover:text-slate-700'">
        <span class="flex items-center gap-1.5">
          <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z"></path>
          </svg>
          Alumnos
        </span>
      </button>
      <button
        (click)="tabActiva.set('importaciones')"
        class="px-4 py-2 rounded-lg text-xs font-bold transition-all"
        [ngClass]="tabActiva() === 'importaciones' ? 'bg-white text-slate-800 shadow-sm' : 'text-slate-500 hover:text-slate-700'">
        <span class="flex items-center gap-1.5">
          <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"></path>
          </svg>
          Importaciones
        </span>
      </button>
    </div>
  </div>

  @if (tabActiva() === 'lista') {
    <app-alumno-lista></app-alumno-lista>
  }

  @if (tabActiva() === 'importaciones') {
    <app-importaciones-alumnos></app-importaciones-alumnos>
  }

</div>
